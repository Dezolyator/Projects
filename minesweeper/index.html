<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сапёр</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Сапёр</h1>

      <div class="window">
        <header class="hud">
          <div class="lcd" id="mines-left" aria-label="Осталось мин">010</div>
          <button type="button" class="face" id="face" aria-label="Новая игра">🙂</button>
          <div class="lcd" id="timer" aria-label="Время">000</div>
        </header>

        <div class="board" id="board" role="grid" aria-label="Поле сапёра"></div>
      </div>

      <div class="controls">
        <label>
          Сложность
          <select id="difficulty">
            <option value="beginner">Новичок · 9×9 · 10 мин</option>
            <option value="intermediate">Любитель · 16×16 · 40 мин</option>
            <option value="expert">Профессионал · 16×30 · 99 мин</option>
          </select>
        </label>
        <p class="hint">ЛКМ — открыть · ПКМ — флаг · двойной клик по цифре — открыть соседей</p>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
